<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Kiểm Tra CorelDraw</title>
    <!-- Liên kết tới file CSS riêng -->
    <link rel="stylesheet" href="../static/css/style.css">
    <!-- Font chữ Google Fonts (Inter) cho tiêu đề/nội dung -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <!-- Badge phía trên tiêu đề -->
        <div class="subtitle-badge">Hệ thống Luyện tập & Kiểm tra</div>

        <!-- Tiêu đề chính -->
        <h1 class="main-title">
            ÔN TẬP KIỂM TRA <br>
            <span class="highlight">CORELDRAW</span>
        </h1>

        <!-- Mô tả ngắn -->
        <p class="description">
            Sẵn sàng củng cố kiến thức đồ họa vector và chuẩn bị tốt nhất cho bài kiểm tra sắp tới.
        </p>

        <!-- Nút Bắt đầu với hiệu ứng 7 sắc cầu vồng -->
        <div class="button-wrapper">
            <button class="btn-rainbow">
                <span class="btn-text">BẮT ĐẦU</span>
            </button>
        </div>
    </div>

</body>

</html>
